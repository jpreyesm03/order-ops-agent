name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orderops
          POSTGRES_PASSWORD: orderops
          POSTGRES_DB: orderops_p5
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderops -d orderops_p5" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://orderops:orderops@localhost:5432/orderops_p5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid

  # Builds the API image on every push. On main it is also pushed to ECR (short-lived OIDC credentials, no stored
  # AWS keys); App Runner deploys new :latest images automatically.
  image:
    runs-on: ubuntu-latest
    needs: api
    permissions:
      contents: read
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      ECR_REPO: 054896499172.dkr.ecr.us-west-2.amazonaws.com/order-ops-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::054896499172:role/order-ops-github-deploy
          aws-region: us-west-2
      - if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.ECR_REPO }}:${{ github.sha }}
            ${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Roll out on ECS
        if: env.PUSH == 'true'
        run: |
          aws ecs update-service --cluster order-ops --service order-ops-api --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster order-ops --services order-ops-api
          curl -fsS https://or-9c9c3432e69a4ff6b5742b1b9aa0054c.ecs.us-west-2.on.aws/healthz
