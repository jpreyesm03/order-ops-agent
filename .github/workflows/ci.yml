name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orderops
          POSTGRES_PASSWORD: orderops
          POSTGRES_DB: orderops_p5
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderops -d orderops_p5" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://orderops:orderops@localhost:5432/orderops_p5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group tau2   # tests include the τ² adapter (no API calls)
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid

  # Builds the API image on every push and smoke-tests it (the app must import with production dependencies
  # only). On main, when API files changed, it is pushed to ECR (short-lived OIDC credentials, no stored AWS keys)
  # and released on Lambda: publish a version, check that version directly, then move the `live` alias (the one
  # the public URL serves) to it. A version that fails the check never gets traffic. One deploy at a time.
  image:
    runs-on: ubuntu-latest
    needs: api
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPO: 054896499172.dkr.ecr.us-west-2.amazonaws.com/order-ops-api
      FUNCTION: order-ops-api
      API_URL: https://woepit4n6ywq4satuxhu35lapi0yrnmk.lambda-url.us-west-2.on.aws
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Should this push deploy the API?
        id: deploy
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0   # first push or force-push: deploy
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/|data/|Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No API changes: build and smoke test only."
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false   # Lambda takes a single-platform image manifest, not an index with attestations
          sbom: false
          tags: order-ops-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm order-ops-api:ci python -c "import order_ops.api, order_ops.shopify, order_ops.seed_shopify, order_ops.mcp_server, boto3; print('imports ok')"
          docker run --rm --entrypoint test order-ops-api:ci -x /opt/extensions/lambda-adapter && echo "lambda adapter ok"
      - if: steps.deploy.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::054896499172:role/order-ops-github-deploy
          aws-region: us-west-2
      - if: steps.deploy.outputs.run == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push to ECR
        if: steps.deploy.outputs.run == 'true'
        run: |
          for tag in "${{ github.sha }}" latest; do
            docker tag order-ops-api:ci "$ECR_REPO:$tag" && docker push -q "$ECR_REPO:$tag"
          done
      - name: Release on Lambda (publish, check, then switch the live alias)
        if: steps.deploy.outputs.run == 'true'
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$ECR_REPO:${{ github.sha }}" \
            --query '[FunctionName,LastUpdateStatus]' --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          VERSION=$(aws lambda publish-version --function-name "$FUNCTION" --description "${{ github.sha }}" \
                    --query Version --output text)
          PREVIOUS=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          echo "new version $VERSION (live is on $PREVIOUS)"
          scripts/lambda_smoke.sh "$VERSION"
          aws lambda update-alias --function-name "$FUNCTION" --name live --function-version "$VERSION" \
            --query '[Name,FunctionVersion]' --output text
          curl -fsS --max-time 30 "$API_URL/healthz"; echo
          echo "Rollback: scripts/lambda_rollback.sh $PREVIOUS"
